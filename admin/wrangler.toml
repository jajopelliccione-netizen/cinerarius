name = "cinerarius-admin"
main = "src/index.js"
compatibility_date = "2024-09-23"

# --- Database D1 (binding "DB") ---
# 1) crea il DB:   wrangler d1 create cinerarius_admin
# 2) incolla qui sotto il database_id che ti restituisce il comando
[[d1_databases]]
binding = "DB"
database_name = "cinerarius_admin"
database_id = "INCOLLA_QUI_IL_DATABASE_ID"

# --- Workers AI (binding "AI") — gratis, nessuna chiave ---
# Serve per la bozza automatica delle specialità dei barbieri.
[ai]
binding = "AI"

# --- Seed admin iniziale (cambio password forzato al primo accesso) ---
# Meglio impostarli come secret in produzione:
#   wrangler secret put SEED_EMAIL
#   wrangler secret put SEED_PASSWORD
[vars]
SEED_EMAIL = "marco@logica.com"
SEED_PASSWORD = "Cinerarius!2026"
# Repo del sito su cui pubblicare le modifiche (Build da Git → deploy automatico)
GITHUB_REPO = "jajopelliccione-netizen/cinerarius"
GITHUB_BRANCH = "main"
# Modello AI (default ok): AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# --- Token GitHub (SOLO come secret, mai in chiaro) ---
# Crea un Fine-grained PAT con permesso "Contents: Read and write" sul repo del sito, poi:
#   wrangler secret put GITHUB_TOKEN
